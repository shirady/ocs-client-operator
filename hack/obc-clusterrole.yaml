# ClusterRole for OBC controller
# Apply: kubectl apply -f hack/obc-clusterrole.yaml
# Binding: kubectl create clusterrolebinding ocs-client-operator-obc-rolebinding \
#   --clusterrole=ocs-client-operator-obc-role \
#   --serviceaccount=openshift-storage-client:ocs-client-operator-controller-manager
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ocs-client-operator-obc-role
rules:
  - apiGroups: ["objectbucket.io"]
    resources: ["objectbucketclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["objectbucket.io"]
    resources: ["objectbucketclaims/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["objectbucket.io"]
    resources: ["objectbuckets"]
    verbs: ["get", "list", "watch", "update", "delete"]
  - apiGroups: ["ocs.openshift.io"]
    resources: ["storageclients"]
    verbs: ["get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update"]
